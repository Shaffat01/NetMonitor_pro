<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · NetMonitor Pro</title></head>
<body>
<main>
    <h1>Sign in to NetMonitor Pro</h1>
    {% if invalid %}<p role="alert">Invalid username or password.</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><label>Username <input name="username" autocomplete="username" required></label></p>
        <p><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
        <button>Sign in</button>
    </form>
</main>
</body>
</html>
